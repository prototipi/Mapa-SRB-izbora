<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{t:Serbia Election Map 2023–2026}}</title>
<!-- Standalone page: d3 is included below. The fonts load from Google Fonts when online; otherwise the system font is used. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one-screen app. Header strip, then the map (left, fills) beside a results panel (right, scrolls). Stacks on phones.
   pa / pb = the main list and the main challenger of each election; lx = any other list; vi = turnout. */
:root {
  --bg: #eef1f4; --surface: #fbfcfd; --ink: #0f1722; --ink-2: #4a5462; --muted: #848c98;
  --line: #d9dee5; --line-2: #c3cad3; --hover: rgba(15,23,34,.06); --focus: #2a78d6;
  --pa: #2a78d6; --pa-lo: #cde2fb; --pa-hi: #0d366b;
  --pb: #eb6834; --pb-lo: #fbd9c9; --pb-hi: #7a2a0c;
  --lx: #1baf7a; --lx-lo: #c9efe0; --lx-hi: #0b5c3f;
  --vi: #6250d6; --vi-lo: #dcd8f7; --vi-hi: #2a1f73;
  --fl-ab: #a8327a; --fl-bb: #9e1c22; --fl-ba: #5b4fcf;  /* Winner change: 1→3 reddish purple, 7 and 3 dark red, 7→1 bluish purple */
  --neutral: #e6e5e1; --nodata: #e3e7ec; --stroke: #c9d0d8; --land: #e1e6ec;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1116; --surface: #161a20; --ink: #eef1f4; --ink-2: #b8c0cb; --muted: #858e9b;
  --line: #262c35; --line-2: #343c47; --hover: rgba(238,241,244,.07); --focus: #3987e5;
  --pa: #3987e5; --pa-lo: #1b2a3f; --pa-hi: #b7d3f6;
  --pb: #d95926; --pb-lo: #3a2219; --pb-hi: #f8c7af;
  --lx: #199e70; --lx-lo: #16302a; --lx-hi: #a8e6cf;
  --vi: #9085e9; --vi-lo: #25223f; --vi-hi: #d9d4fa;
  --fl-ab: #b8509a; --fl-bb: #ad2e2c; --fl-ba: #8579ea;
  --neutral: #3a3a37; --nodata: #1f242c; --stroke: #161a20; --land: #232933; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1116; --surface: #161a20; --ink: #eef1f4; --ink-2: #b8c0cb; --muted: #858e9b;
  --line: #262c35; --line-2: #343c47; --hover: rgba(238,241,244,.07); --focus: #3987e5;
  --pa: #3987e5; --pa-lo: #1b2a3f; --pa-hi: #b7d3f6;
  --pb: #d95926; --pb-lo: #3a2219; --pb-hi: #f8c7af;
  --lx: #199e70; --lx-lo: #16302a; --lx-hi: #a8e6cf;
  --vi: #9085e9; --vi-lo: #25223f; --vi-hi: #d9d4fa;
  --fl-ab: #b8509a; --fl-bb: #ad2e2c; --fl-ba: #8579ea;
  --neutral: #3a3a37; --nodata: #1f242c; --stroke: #161a20; --land: #232933; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.brand h1 { margin: 0; font: 600 16px/1.2 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 0; color: var(--ink-2); font-size: 12.5px; }
#lang { padding: 3px 6px; font-size: 12.5px; border-radius: 6px; }
.brandrow { display: flex; align-items: center; gap: 10px; }
.linkbtn { border: 0; background: none; padding: 2px 0; cursor: pointer; color: var(--ink-2); font-size: 12.5px; text-decoration: underline; text-underline-offset: 2px; }
.linkbtn:hover { color: var(--ink); }
/* Sources dialog */
#sources { width: min(600px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 18px 20px 20px; border: 1px solid var(--line-2); border-radius: 12px;
  background: var(--surface); color: var(--ink); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
#sources::backdrop { background: rgba(15,23,34,.4); }
#sources h2 { margin: 0 0 12px; font: 600 15px/1.3 var(--f-display); }
#sources dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: 13px; }
#sources dt { font-weight: 600; }
#sources dd { margin: 0; color: var(--ink-2); }
#sources a { color: var(--focus); }
#sources .x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 6px; background: none; cursor: pointer; color: var(--ink-2); font-size: 20px; line-height: 1; }
#sources .x:hover { background: var(--hover); color: var(--ink); }
@media (max-width: 560px) { #sources dl { grid-template-columns: 1fr; gap: 2px; } #sources dd { margin-bottom: 8px; } }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; background: var(--bg); }
.seg button { border: 0; background: none; padding: 5px 9px; border-radius: 6px; cursor: pointer; color: var(--ink-2); font-weight: 500; font-size: 12.5px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg.years button { font-weight: 600; }
.seg.sm button { padding: 3px 9px; font-size: 12px; }
select, input[type="search"] {
  border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 6px 9px; font-size: 13px; max-width: 100%;
}
#listSel { max-width: 230px; }
#search { width: 150px; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 440px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; overflow: hidden; }
#map { display: block; width: 100%; height: 100%; touch-action: none; }
#map path.unit { stroke: var(--stroke); stroke-width: .6px; vector-effect: non-scaling-stroke; cursor: pointer; }
#map path.unit.empty { cursor: default; }
#map path.unit:hover:not(.empty) { stroke: var(--ink); stroke-width: 1.2px; }
/* Top left of the map: level switch and (List share view) the list menu */
.maptop { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: calc(100% - 90px); }
.levels { background: var(--surface); }
.legend.static #listSel { flex-basis: 100%; max-width: 360px; }
#map path.gborder { fill: none; stroke: var(--stroke); stroke-width: 1.4px; vector-effect: non-scaling-stroke; pointer-events: none; }
#map path.hov { fill: none; stroke: var(--ink); stroke-width: 1.4px; vector-effect: non-scaling-stroke; pointer-events: none; }
#map path.rland { stroke: var(--surface); stroke-width: 1.2px; vector-effect: non-scaling-stroke; stroke-linejoin: round; cursor: pointer; }
#map path.rland.ctx { cursor: default; }
#map text.rname { fill: var(--muted); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; text-anchor: middle; dominant-baseline: central;
  paint-order: stroke; stroke: var(--bg); stroke-linejoin: round; pointer-events: none; }
#map circle.prison { stroke: var(--ink); vector-effect: non-scaling-stroke; stroke-width: 1.4px; cursor: pointer; }
#map circle.prison:hover, #map circle.prison.on { stroke-width: 2.6px; }
#map path.sel { fill: none; stroke: var(--ink); stroke-width: 2.4px; vector-effect: non-scaling-stroke; pointer-events: none; }
#map text.lbl { fill: var(--ink); font-weight: 600; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.hatch-line { stroke: var(--line-2); stroke-width: 1.2; }

.legend {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; max-width: min(380px, calc(100% - 24px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.06);
}
.legend h3 { margin: 0 0 7px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.legend .rows { display: flex; flex-direction: column; gap: 4px; }
.legend .row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
.legend .cnt { margin-left: auto; padding-left: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend .bins { display: flex; }
.legend .bins span { width: 30px; height: 12px; }
.legend .bins span + span { margin-left: 1px; }
.legend .ticks { position: relative; height: 15px; font-size: 11px; color: var(--ink-2); }
.legend .ticks span { position: absolute; top: 1px; transform: translateX(-50%); }
.legend .ends { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 3px; }
.legend .lnote { margin: 6px 0 0; font-size: 11.5px; color: var(--ink-2); line-height: 1.4; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; display: inline-block; }
.sw.nd { background: repeating-linear-gradient(45deg, var(--nodata) 0 3px, var(--line-2) 3px 4px); }

.zoom { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { min-width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-weight: 600; padding: 0 9px; }
.zoom button:hover { background: var(--bg); }
.zoom button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.zoom .numctl { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.zoom .numctl[hidden] { display: none; }
.zoom #znum { display: inline-flex; align-items: center; justify-content: center; }
.legend .aunits { margin-bottom: 8px; }
/* Map options (bottom right): Show: [ ] Prisons */
.offmap { position: absolute; right: 12px; bottom: 12px; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }
.offmap .cap { color: var(--ink-2); }
.offmap .opt { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.offmap input { margin: 0; accent-color: var(--ink); width: 15px; height: 15px; cursor: pointer; }

.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 220px; max-width: 320px;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px;
  box-shadow: 0 8px 24px rgba(0,0,0,.14); font-size: 12.5px;
}
.tip b { display: block; font-size: 13.5px; margin-bottom: 1px; }
/* Phone: hint when one finger tries to move the zoomed map */
.touchhint { position: absolute; left: 50%; top: max(31vh, 180px); transform: translate(-50%, -50%); z-index: 6; pointer-events: none;
  padding: 8px 14px; border-radius: 8px; background: rgba(15,23,34,.82); color: #fff; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.tip .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 6px; }
.tip .kv { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; }
.tip .kv .r { text-align: right; font-variant-numeric: tabular-nums; }
.tip .cmp { display: grid; grid-template-columns: 1fr auto auto auto; gap: 3px 10px; align-items: center; }
.tip .cmp .r { text-align: right; font-variant-numeric: tabular-nums; }
.tip .cmp .h { color: var(--muted); font-size: 11px; text-align: right; }

/* Abroad: one block per country, drawn over the Serbia map */
.abroad { position: absolute; inset: 0; z-index: 3; background: var(--bg); overflow-y: auto; padding-block: 14px 28px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.mapwrap.is-region .levels, .mapwrap.is-region .offmap { display: none; }
.mapwrap.is-region #map path.gborder { stroke: var(--surface); }  /* country borders on the Region map */
.mapwrap.is-abroad .zoom, .mapwrap.is-abroad .offmap, .mapwrap.is-abroad .maptop, .mapwrap.is-abroad > .legend { display: none; }
.legend.static { position: static; max-width: none; box-shadow: none; display: flex; flex-wrap: wrap; gap: 6px 28px; align-items: flex-start; }
.legend.static > div, .legend.static > p { min-width: 0; }
.legend.static .lnote { margin: 0; flex-basis: 100%; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; margin-top: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 10px 8px; cursor: pointer;
  display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card:hover { border-color: var(--line-2); }
.card[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.card .ch { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .cn { font-weight: 600; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .cv { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card svg { display: block; width: 100%; height: auto; }
.card .land { stroke: var(--line-2); stroke-width: .8; stroke-linejoin: round; }
.card .dot { stroke: var(--surface); stroke-width: 1.1; }
.card .dot.old { fill: none; stroke: var(--ink-2); stroke-width: 1.3; }
.card .dot:hover { stroke: var(--ink); stroke-width: 1.6; }
.card .cs { font-size: 11.5px; color: var(--muted); display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.card .cs > span { min-width: 0; }
.card .zbtn { flex: none; }
.card .zbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 7px; font-size: 11.5px; cursor: pointer; color: var(--ink-2); }
.card .zbtn:hover { border-color: var(--ink-2); color: var(--ink); }
/* One country, large, with zoom (opened from a block with more than one polling station) */
.azoom { position: absolute; inset: 0; z-index: 4; background: var(--bg); display: flex; flex-direction: column; }
.azoom[hidden] { display: none; }
.azoom .zh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.azoom .zh h3 { margin: 0; font: 600 17px/1.2 var(--f-display); }
.azoom .zh .cv { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.azoom .zh .note { flex-basis: 100%; }
.azoom .zh .sp { flex: 1; }
.azoom .zh button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-width: 34px; height: 32px; padding: 0 10px; cursor: pointer; font-weight: 600; }
.azoom .zh button:hover { background: var(--bg); }
.azoom svg { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; cursor: grab; }
.azoom .land { stroke: var(--line-2); stroke-width: 1px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.azoom .dot { stroke: var(--surface); stroke-width: 1.4px; vector-effect: non-scaling-stroke; cursor: default; }
.azoom .dot.old { fill: none; stroke: var(--ink-2); stroke-width: 1.6px; }
.azoom .dot:hover { stroke: var(--ink); stroke-width: 2.2px; }
.azoom .clbl { fill: var(--ink-2); paint-order: stroke; stroke: var(--bg); stroke-linejoin: round; dominant-baseline: central; pointer-events: none; }

aside { border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; min-height: 0; }
.panel { padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 18px; }
.ptop { display: flex; align-items: flex-start; gap: 12px; }
.ptop > div { flex: 1; min-width: 0; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.ptop h2 { margin: 3px 0 2px; font: 600 21px/1.2 var(--f-display); letter-spacing: -.01em; text-wrap: balance; }
.ptop .meta { color: var(--ink-2); font-size: 12.5px; }
.close { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 10px; cursor: pointer; font-size: 12.5px; flex: none; }
.close:hover { background: var(--bg); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0; }
.stats div { background: var(--surface); padding: 9px 11px; min-width: 0; }
.stats dt { font-size: 11px; color: var(--muted); }
.stats dd { margin: 1px 0 0; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stats dd small { font-size: 11.5px; font-weight: 400; color: var(--ink-2); }
.sec h4 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sec h4 span { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
.bars { display: flex; flex-direction: column; gap: 7px; }
.bar { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; }
.bar .no { font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.bar .nm { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .pc { font-size: 13px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.bar .track { grid-column: 2 / 4; position: relative; height: 6px; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 3px 3px 0; min-width: 1px; }
.bar .thr { position: absolute; top: -3px; bottom: -3px; border-left: 1px dashed var(--muted); }
.bar .vv { grid-column: 2 / 4; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -1px; }
.more { border: 0; background: none; color: var(--ink-2); padding: 2px 0; cursor: pointer; font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; justify-self: start; margin-top: 4px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.st th:nth-child(2), .st td:nth-child(2) { text-align: left; white-space: normal; min-width: 150px; }
th { position: sticky; top: 0; background: var(--surface); font-weight: 600; font-size: 11.5px; color: var(--ink-2); }
.st th[data-k] { cursor: pointer; user-select: none; }
th[aria-sort="ascending"]::after { content: " ↑"; }
th[aria-sort="descending"]::after { content: " ↓"; }
tbody tr:hover { background: var(--hover); }
tbody tr:last-child td { border-bottom: 0; }
.cmpt td:first-child, .cmpt th:first-child { text-align: left; white-space: normal; }
.cmpt td:last-child { font-weight: 600; }
.cmpt .sw { width: 9px; height: 9px; margin-right: 6px; vertical-align: baseline; }
td.pending { color: var(--muted); font-style: italic; }
td a { color: var(--ink-2); }
.chip { display: inline-block; min-width: 22px; padding: 1px 5px; border-radius: 5px; font-size: 11px; font-weight: 600; text-align: center; color: #fff; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.cols2 > * { min-width: 0; }
.cols2 .bar { grid-template-columns: 18px minmax(0, 1fr) auto; gap: 2px 6px; }
.cols2 .bar .nm, .cols2 .bar .pc { font-size: 12px; }

@media (max-width: 860px) {
  .app { height: auto; display: block; }
  main { display: block; }
  /* Phone: the legend and the off-map buttons go below the map, so they do not cover it */
  .mapwrap { height: auto; overflow: visible; }
  #map { height: 62vh; min-height: 360px; touch-action: pan-x pan-y; }  /* one finger scrolls the page; two fingers move the map */
  .mapwrap.is-abroad #map { height: 0; min-height: 0; }
  .mapwrap.is-abroad .abroad { position: static; }
  .azoom { position: fixed; z-index: 30; }
  aside { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .panel { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .controls { margin-left: 0; width: 100%; }
  #search { flex: 1; min-width: 140px; }
  .mapwrap > .legend { position: static; max-width: none; box-shadow: none; margin: 0 max(12px, env(safe-area-inset-left, 0px)); }
  .offmap { position: static; display: inline-flex; margin: 10px max(12px, env(safe-area-inset-left, 0px)) 14px; }
}

<script>/*__D3__*/</script>
<script>
const D = /*__DATA__*/null;

const stations = n => LANG === 'en' ? `${n} station${n === 1 ? '' : 's'}`

const YEARS = Object.keys(D.E).sort();
const Y0 = YEARS[0], Y1 = YEARS[YEARS.length - 1];
const P0 = D.E[Y0].pair, P1 = D.E[Y1].pair;  // [main list, main challenger], 0-based, per election
const fmt = n => n.toLocaleString(D.locale);
const pct = (x, d = 1) => x == null || isNaN(x) ? '–' : nf(x * 100, d) + '%';
const pp = (x, d = 1) => x == null || isNaN(x) ? '–' : (x > 0.0005 ? '+' : x < -0.0005 ? '−' : '±') + nf(Math.abs(x * 100), d);

// A list's acronym (SNS, SPN, SL) where one is set in the build, otherwise "list N"
const ab = (y, k) => D.E[y].lists[k].abbr || t('list {n}', { n: k + 1 });
const Ab = (y, k) => D.E[y].lists[k].abbr || t('List {n}', { n: k + 1 });
const sname = (y, k) => D.E[y].lists[k].abbr || D.E[y].lists[k].short;
const lname = (y, k) => D.E[y].lists[k].abbr || `${k + 1}. ${D.E[y].lists[k].short}`;
const partyOf = (y, k) => D.parties[D.E[y].lists[k].party] || D.parties.other;  // for the Other parties view
const tag = (y, k) => D.E[y].lists[k].abbr || String(k + 1);  // short label: acronym or list number

const NAT = { name: t('Serbia'), district: t('All polling stations, including abroad and prisons'), nat: true, munis: [], y: {} };
const ALL = [...U, NAT];
for (const y of YEARS) {
  const E = D.E[y];
  for (const u of ALL) u.y[y] = blank(E.lists.length);
  for (const s of E.stations) { add(U[s[0]].y[y], s); U[s[0]].y[y].st.push(s); add(NAT.y[y], s); }
  for (const u of ALL) derive(u.y[y], E.pair);

const role = (lead, pair) => lead === pair[0] ? 'A' : lead === pair[1] ? 'B' : 'X';

  const a = u.y[Y0], b = u.y[Y1], ok = !!(a.valid && b.valid);

ALL.forEach(setChange);
const SPECIAL = U.filter(u => u.key === 'abroad' || u.key === 'prisons');
const ONMAP = U.filter(u => !SPECIAL.includes(u));
const ABROAD = U.find(u => u.key === 'abroad');
const SRB = { key: 'srb', name: t('Serbia'), district: t('Polling stations in Serbia (municipalities and prisons), without abroad'),
  munis: [], y: {}, inland: true, lines: D.borders.country.Serbia };
for (const y of YEARS) {
  SRB.y[y] = blank(D.E[y].lists.length);

setChange(SRB);

// ---------- abroad: one record per country, and one per polling station ----------
const COUNTRY = {}, STN = {}, LOC = new Map();  // LOC: station row -> station record
for (const y of YEARS) {
  const E = D.E[y];
  STN[y] = [];
  E.stations.forEach((s, i) => {
    const loc = E.loc[i];
    if (!loc) return;
    const [cc, city, lon, lat] = loc;
    const c = COUNTRY[cc] || (COUNTRY[cc] = { key: 'c-' + cc, cc, name: D.countries[cc].name, en: D.countries[cc].en,

    const agg = blank(E.lists.length); add(agg, s); agg.st.push(s);
    const p = { s, year: y, cc, city, lon, lat, y: { [y]: derive(agg, E.pair) }, ch: { ok: false } };

const COUNTRIES = Object.values(COUNTRY);
for (const c of COUNTRIES) {

    c.y[y] = blank(D.E[y].lists.length);
    for (const p of c.pts[y]) { add(c.y[y], p.s); c.y[y].st.push(p.s); }
    derive(c.y[y], D.E[y].pair);
  }

// ---------- prisons: one record per station number (the same institutions in every election) ----------
const PRISON = {};
for (const y of YEARS) {
  const E = D.E[y];
  E.stations.forEach((s, i) => {
    const pl = E.ploc[i];
    if (!pl) return;
    const [city, address, lon, lat] = pl;
    const p = PRISON[s[2]] || (PRISON[s[2]] = { key: 'p-' + s[2], prison: true, munis: [], y: {}, lon, lat,
      district: t('Prison polling station {n} · {city}, {address}', { n: s[2], city, address }) });
    p.name = `${s[3]} (${city})`;  // the latest name
    const agg = blank(E.lists.length); add(agg, s); agg.st.push(s);

}
const PRISONS = Object.values(PRISON);
for (const p of PRISONS) {
  for (const y of YEARS) if (!p.y[y]) p.y[y] = derive(blank(D.E[y].lists.length), D.E[y].pair);
  setChange(p);
}

// ---------- colors ----------
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
let C = {};
function readColors() {
  for (const h of ['pa', 'pb', 'lx', 'vi']) C[h] = { mid: css('--' + h), lo: css('--' + h + '-lo'), hi: css('--' + h + '-hi') };

// Colour scales: white at the middle (diverging) or at the low end (sequential), dark at the ends.
// pa = SNS, blue; pb = SL / SPN, red; lx = lower turnout or fewer voters, green; yl = turnout, more voters, yellow.
const GRAD = {
  pa: ['#ffffff', '#4a8fd6', '#08306b'],
  pb: ['#ffffff', '#e0533d', '#7f0000'],
  lx: ['#ffffff', '#41ab5d', '#00441b'],

const seq = ramp, arm = ramp;
const listColor = (y, k) => C[hueOf(y, k)].mid;
const FLIPS = [
  ['AA', () => C.pa.mid, `${Ab(Y0, P0[0])} (${Y0}) → ${ab(Y1, P1[0])} (${Y1})`],
  ['BA', () => C.flip.ba, `${Ab(Y0, P0[1])} (${Y0}) → ${ab(Y1, P1[0])} (${Y1})`],
  ['AB', () => C.flip.ab, `${Ab(Y0, P0[0])} (${Y0}) → ${ab(Y1, P1[1])} (${Y1})`],
  ['BB', () => C.flip.bb, `${Ab(Y0, P0[1])} (${Y0}) → ${ab(Y1, P1[1])} (${Y1})`],
  ['X', () => C.lx.mid, t('Other lists')],
];
let FLIPC = {};

// ---------- state ----------
let view = 'change', cat = 'serbia', level = 'municipality', ymode = 'winner', cmode = 'flip', selected = null, tableYear = Y1, showNums = true, showPrisons = false, tunit = 'pct';
const listK = {}; YEARS.forEach(y => listK[y] = D.E[y].pair[1]);
const STORE = 'izbori-map-v2';
try {
  const s = JSON.parse(localStorage.getItem(STORE) || '{}');
  if (s.view === 'change' || YEARS.includes(s.view)) view = s.view;
  if (s.ymode) ymode = s.ymode; if (s.cmode) cmode = s.cmode;
  if (s.tunit === 'abs') tunit = 'abs';
  if (s.listK) Object.assign(listK, s.listK);
  if (cmode === 'voters') { cmode = 'turnout'; tunit = 'abs'; }  // saved by an older version
  if (s.showNums === false) showNums = false;
  if (s.showPrisons === true) showPrisons = true;
  if (['abroad', 'region'].includes(s.cat)) cat = s.cat;

} catch (e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify({ view, cat, level, ymode, cmode, listK, showNums, showPrisons, tunit })); } catch (e) {} }
const isChange = () => view === 'change';
const isAbroad = () => cat === 'abroad';
const isRegion = () => cat === 'region';  // Serbia with the neighbouring countries
// What the color scales are computed from: municipalities, or (abroad) polling stations per year and countries for change.
const serbiaPop = () => level === 'municipality' ? ONMAP : GLIST[level];
// Region map: Serbia and the neighbouring countries with results are one set of units for the color scales
const regionPop = () => [SRB, ...D.region.filter(cc => COUNTRY[cc]).map(cc => COUNTRY[cc])];
const popFor = y => isAbroad() ? STN[y] : isRegion() ? regionPop() : serbiaPop();
const chPop = () => isAbroad() ? COUNTRIES : isRegion() ? regionPop() : serbiaPop();
const MODES = {
  year: [['winner', () => t('Winner')], ['margin', () => t('{a} vs {b}', { a: Ab(view, D.E[view].pair[0]), b: ab(view, D.E[view].pair[1]) })], ['others', () => t('Other parties')], ['share', () => t('List share')], ['turnout', () => t('Turnout')]],
  change: [['flip', () => t('Winner')], ['swing', () => t('Lead swing')], ['others', () => t('Other parties')], ['shareA', () => t('{a} share', { a: Ab(Y1, P1[0]) })], ['turnout', () => t('Turnout')]],
};
// Views that write a number (voters, in thousands) on each municipality
const numMode = () => isChange() ? cmode === 'turnout' : ymode === 'turnout';

// ---------- scales per view ----------

  const mx = Math.max(d3.quantile(abs, q) || steps[0], steps[0]);
  const step = steps.find(s => mx / s <= 5) || steps[steps.length - 1];

const partialNote = () => YEARS.filter(y => NAT.y[y].rep < NAT.y[y].n)
  .map(y => ' ' + t('{y} counts reported stations only ({rep} of {n}).', { y, rep: fmt(NAT.y[y].rep), n: fmt(NAT.y[y].n) })).join('');
function binsFor() {

      title: t('Lead swing, {span}, points', { span }), ends: [t('Toward {a}', { a: ab(Y1, P1[0]) }), t('Toward the challenger')],
      note: t('Lead = challenger share − {a} share. Challenger: {b0} in {y0}, {b1} in {y1}.', { a: ab(Y1, P1[0]), b0: ab(Y0, P0[1]), y0: Y0, b1: ab(Y1, P1[1]), y1: Y1 }) });

      title: t('{a} share change, {span}, points', { a: Ab(Y1, P1[0]), span }), ends: [t('Lost share'), t('Gained share')],
      note: `${Y0}: ${esc(D.E[Y0].lists[P0[0]].short)}. ${Y1}: ${esc(D.E[Y1].lists[P1[0]].short)}.` });
    if (cmode === 'others') return Object.assign(divBins(chPop().map(u => u.ch.others), 'br', 'tl'), { val: u => u.ch.others,
      title: t('Other parties: share change, {span}, points', { span }), ends: [t('Lost share'), t('Gained share')],
      note: t('All lists except {a0} and {b0} in {y0}, {a1} and {b1} in {y1}.', { a0: ab(Y0, P0[0]), b0: ab(Y0, P0[1]), y0: Y0, a1: ab(Y1, P1[0]), b1: ab(Y1, P1[1]), y1: Y1 }) });
    const onMap = !isAbroad() && !isRegion();
    if (cmode === 'turnout' && tunit === 'abs') return Object.assign(divBins(chPop().map(u => u.ch.voters), 'lx', 'yl',
      [500, 1000, 2000, 5000, 10000, 20000, 50000, 100000], t => kfmt(Math.abs(t)), .95), { val: u => u.ch.voters,
      title: t('Turnout: change in number of voters, {span}, thousands', { span }), ends: [t('Fewer voters'), t('More voters')],
      note: (onMap && showNums ? t('Numbers on the map: change in voters, in thousands.') : '') + partialNote() });

    return { th, cols, val: u => u.y[view].margin, ticks: th.map(t => Math.round(Math.abs(t) * 100)),
      ends: [t('{a} ahead', { a: Ab(view, p[0]) }), t('{a} ahead', { a: Ab(view, p[1]) })], title: t('Lead of {b} over {a}, points', { a: ab(view, p[0]), b: ab(view, p[1]) }) };
  }

    const vals = YEARS.flatMap(y => popFor(y).filter(u => !u.kosovo && u.y[y].turnout != null).map(u => u.y[y].turnout)).sort(d3.ascending);
    const lo = Math.max(0, Math.floor(d3.quantile(vals, .02) * 20) / 20);
    const hi = Math.min(1, Math.ceil(d3.quantile(vals, .98) * 20) / 20);
    const th = d3.range(lo + .05, hi - .001, .05);
    const cols = d3.range(th.length + 1).map(i => seq('yl', .1 + .9 * i / th.length));
    return { th, cols, val: u => u.y[view].turnout, ticks: th.map(t => Math.round(t * 100)),
      ends: ['<' + Math.round((lo + .05) * 100) + '%', '>' + Math.round((hi - .05) * 100) + '%'],
      title: t('Turnout, % of registered voters'),
      note: t('Same scale for {years}.', { years: YEARS.join(t(' and ')) }) + (showNums && !isAbroad() && !isRegion()
        ? ' ' + (tunit === 'abs' ? t('Numbers on the map: voters, in thousands.') : t('Numbers on the map: turnout, %.')) : '') };
  }

}
let B = null;

function barsHtml(a, y, nat, compact) {
  const key = y + (compact ? 'c' : '');
  const ks = a.order.filter(k => nat || a.votes[k] > 0);
  const lim = compact ? 5 : 6;
  const shown = showAll[key] || ks.length <= lim + 2 ? ks : ks.slice(0, lim);
  const mx = Math.max(a.share[a.order[0]], .03);
  const thr = nat ? `<span class="thr" style="left:${3 / (mx * 100) * 100}%" title="${t('3% threshold')}"></span>` : '';
  const rows = shown.map(k => `<div class="bar" title="${esc(D.E[y].lists[k].full)}">
      <span class="no">${k + 1}</span><span class="nm">${esc(sname(y, k))}</span><span class="pc">${pct(a.share[k], compact ? 1 : 2)}</span>
      <span></span><span class="track"><span class="fill" style="width:${a.share[k] / mx * 100}%;background:${listColor(y, k)}"></span>${thr}</span>
      ${compact ? '' : `<span></span><span class="vv">${t('{n} votes', { n: fmt(a.votes[k]) })}</span>`}</div>`).join('');
  const more = ks.length > shown.length ? `<button type="button" class="more" data-more="${key}">${t('Show all {n} lists', { n: ks.length })}</button>` : '';
  return `<div class="bars">${rows}</div>${more}`;
}

    ${r(`${sw('pb')}${t('Challenger: {a} / {b}', { a: ab(Y0, P0[1]), b: ab(Y1, P1[1]) })}`, sv(a, P0[1]), sv(b, P1[1]), '')}

    ${r(t('Voters'), fmt(a.voted), fmt(b.voted), a.valid && b.valid ? sdiff(a.voted, b.voted) : '–')}
    ${r(t('Registered voters'), fmt(a.reg), fmt(b.reg), dReg)}
    ${r(t('Invalid ballots'), pct(a.voted ? a.invalid / a.voted : null), pct(b.voted ? b.invalid / b.voted : null), a.voted && b.voted ? pp(b.invalid / b.voted - a.invalid / a.voted) + pts : '–')}
    </tbody></table></div>${b.rep < b.n ? `<p class="note" style="margin-top:6px">${t('{y}: {rep} of {n} stations reported.', { y: Y1, rep: fmt(b.rep), n: fmt(b.n) })}</p>` : ''}</section>`;

function stationRows(u, y) {

  const [[x0, y0], [x1, y1]] = d3.geoBounds(geom);
  const proj = d3.geoAzimuthalEqualArea().rotate([-(x0 + x1) / 2, -(y0 + y1) / 2]);

// Stations at the same place sit in a small spiral around it, so each one stays visible.
function dotsSvg(c) {
  const ys = isChange() ? [Y1, Y0] : [view];
  const groups = new Map();
  for (const y of ys) for (const p of c.pts[y]) {
    const k = p.lon + ',' + p.lat;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p);
  }
  let out = '';
  for (const arr of groups.values()) {
    const [x, y] = c.proj([arr[0].lon, arr[0].lat]);
    arr.forEach((p, i) => {
      const r = 3.9 * Math.sqrt(i), t = i * 2.39996;
      const cx = (x + r * Math.cos(t)).toFixed(1), cy = (y + r * Math.sin(t)).toFixed(1);
      const id = `data-y="${p.year}" data-i="${STN[p.year].indexOf(p)}"`;
      if (isChange()) {
        out += p.year === Y0 ? `<circle class="dot old" cx="${cx}" cy="${cy}" r="3" ${id}/>`
          : `<circle class="dot" cx="${cx}" cy="${cy}" r="3.3" fill="var(--ink)" ${id}/>`;
      } else {
        const f = fillOf(p);
        out += `<circle class="dot" cx="${cx}" cy="${cy}" r="3.4" fill="${f.startsWith('url') ? C.nodata : f}" ${id}/>`;
      }
    });
  }
  return out;
}
function renderAbroad(legend) {
  const y = isChange() ? Y1 : view;
  const list = COUNTRIES.filter(c => isChange() ? c.y[Y0].n || c.y[Y1].n : c.y[view].n)
    .sort((a, b) => b.y[y].voted - a.y[y].voted || b.y[Y0].voted - a.y[Y0].voted || a.name.localeCompare(b.name, D.locale));
  const cards = list.map(c => {
    const f = fillOf(c), sw = f.startsWith('url') ? C.nodata : f;
    const land = isChange() ? f : 'var(--land)';
    const sub = isChange() ? t('{y0}: {n0} · {y1}: {n1} stations · {v0} → {v1} voters', { y0: Y0, n0: c.y[Y0].n, y1: Y1, n1: c.y[Y1].n, v0: kfmt(c.y[Y0].voted) + t('k'), v1: kfmt(c.y[Y1].voted) + t('k') })
      : `${stations(c.y[view].n)} · ${t('{v} voters', { v: kfmt(c.y[view].voted) + t('k') })}`;
    return `<div class="card" role="button" tabindex="0" data-cc="${c.cc}" aria-pressed="${selected === c}" title="${esc(c.name)}">
      <div class="ch"><span class="cn">${esc(c.name)}</span><span class="cv"><span class="sw" style="background:${sw}"></span>${offVal(c)}</span></div>
      <svg viewBox="0 0 ${CW} ${CH}" role="img" aria-label="${esc(c.name)}: ${t('polling stations')}"><path class="land" d="${c.landD}" fill="${land}"/>${dotsSvg(c)}</svg>
      <div class="cs"><span>${sub}</span>${zoomPts(c).length > 1 ? `<button type="button" class="zbtn" data-zoom="${c.cc}" aria-label="${t('Zoom into {c}', { c: esc(c.name) })}" title="${t('Zoom into {c}', { c: esc(c.name) })}">${t('Zoom')}</button>` : ''}</div></div>`;
  }).join('');
  const aunits = isChange() && cmode === 'turnout' ? `<div class="seg sm aunits" role="group" aria-label="${t('Turnout in voters or in percent')}">${
    [['abs', '#', 'Change in number of voters (thousands)'], ['pct', '%', 'Change in turnout (points)']].map(([k, l, ti]) =>
      `<button type="button" data-unit="${k}" title="${t(ti)}" aria-pressed="${tunit === k}">${l}</button>`).join('')}</div>` : '';
  abroadEl.innerHTML = `<div class="legend static">${aunits ? `<div style="flex-basis:100%">${aunits}</div>` : ''}${legend}</div><div class="cards">${cards}</div>`;
  abroadEl.querySelector('.legend.static').appendChild(listSel);  // the list menu (List share view) above the blocks
  renderZoom();
}
// Polling stations of a country in the current view (both elections in the Change view)
const zoomPts = c => (isChange() ? [Y1, Y0] : [view]).flatMap(y => c.pts[y]);
const azEl = document.getElementById('azoom');
let zoomCC = null, zoomT = d3.zoomIdentity;
function openZoom(cc) { zoomCC = cc; zoomT = d3.zoomIdentity; select(COUNTRY[cc]); }
function closeZoom() { zoomCC = null; zoomT = d3.zoomIdentity; tip.hidden = true; renderZoom(); }
function renderZoom() {
  azEl.hidden = !(isAbroad() && zoomCC);
  if (azEl.hidden) return;
  const c = COUNTRY[zoomCC], f = fillOf(c), sw = f.startsWith('url') ? C.nodata : f;
  azEl.innerHTML = `<div class="zh"><button type="button" id="zback">← ${t('All countries')}</button><h3>${esc(c.name)}</h3>
    <span class="cv"><span class="sw" style="background:${sw}"></span>${offVal(c)}</span><span class="sp"></span>
    <button type="button" id="zzin" aria-label="${t('Zoom in')}">+</button><button type="button" id="zzout" aria-label="${t('Zoom out')}">−</button><button type="button" id="zzall" title="${t('Show the whole country')}">${t('All')}</button>
    <p class="note">${t('Scroll or pinch to zoom, drag to move. Each dot is one polling station at its city; stations in the same city sit in a small spiral.')}</p></div>
    <svg id="zsvg" role="img" aria-label="${esc(c.name)}: ${t('polling stations')}"></svg>`;
  const svgZ = d3.select('#zsvg'), box = svgZ.node().getBoundingClientRect(), w = box.width, h = Math.max(box.height, 200);
  svgZ.attr('viewBox', `0 0 ${w} ${h}`);
  const geom = { type: 'Feature', geometry: D.countries[c.cc].geometry };
  const pts = zoomPts(c);
  const proj = d3.geoAzimuthalEqualArea().rotate(c.proj.rotate())
    .fitExtent([[30, 30], [w - 30, h - 30]], { type: 'FeatureCollection', features: [geom, { type: 'Feature', geometry: { type: 'MultiPoint', coordinates: pts.map(p => [p.lon, p.lat]) } }] });
  const gz = svgZ.append('g');
  gz.append('path').attr('class', 'land').attr('d', d3.geoPath(proj)(geom)).attr('fill', isChange() ? f : 'var(--land)');
  const groups = d3.groups(pts, p => p.lon + ',' + p.lat);
  const items = [], places = [];
  for (const [, arr] of groups) {
    const [x, y] = proj([arr[0].lon, arr[0].lat]);
    arr.forEach((p, i) => items.push({ p, x, y, ox: 6.2 * Math.sqrt(i) * Math.cos(i * 2.39996), oy: 6.2 * Math.sqrt(i) * Math.sin(i * 2.39996) }));
    places.push({ x, y, name: arr[0].city, rad: 6.2 * Math.sqrt(arr.length - 1) + 6 });
  }
  const dots = gz.selectAll('circle').data(items).join('circle')
    .attr('class', d => 'dot' + (isChange() && d.p.year === Y0 ? ' old' : ''))
    .attr('fill', d => { if (isChange()) return d.p.year === Y0 ? 'none' : 'var(--ink)'; const x = fillOf(d.p); return x.startsWith('url') ? C.nodata : x; })
    .attr('data-y', d => d.p.year).attr('data-i', d => STN[d.p.year].indexOf(d.p));
  const lbls = gz.selectAll('text').data(places).join('text').attr('class', 'clbl').text(d => d.name);
  const place = k => {
    dots.attr('cx', d => d.x + d.ox / k).attr('cy', d => d.y + d.oy / k).attr('r', d => (isChange() && d.p.year === Y0 ? 4 : 4.6) / k);
    lbls.attr('x', d => d.x + d.rad / k).attr('y', d => d.y).style('font-size', 11.5 / k + 'px').style('stroke-width', 3 / k + 'px');
  };
  const zm = d3.zoom().scaleExtent([1, 300]).on('zoom', e => { zoomT = e.transform; gz.attr('transform', e.transform); place(e.transform.k); });
  svgZ.call(zm).on('dblclick.zoom', null);
  svgZ.call(zm.transform, zoomT);
  place(zoomT.k);
  const anim = ms => svgZ.transition().duration(ms * motion());
  document.getElementById('zzin').onclick = () => anim(250).call(zm.scaleBy, 1.8);
  document.getElementById('zzout').onclick = () => anim(250).call(zm.scaleBy, 1 / 1.8);
  document.getElementById('zzall').onclick = () => anim(400).call(zm.transform, d3.zoomIdentity);
  document.getElementById('zback').onclick = closeZoom;
}
azEl.addEventListener('pointermove', e => {
  const d = e.target.closest('circle.dot');
  if (!d || e.pointerType === 'touch') { tip.hidden = true; return; }
  showTip(e, stationTip(STN[d.dataset.y][+d.dataset.i]));
});
azEl.addEventListener('pointerleave', () => { tip.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && zoomCC && !srcDlg.open) closeZoom(); });
window.addEventListener('resize', () => { if (zoomCC && isAbroad()) renderZoom(); });
function stationTip(p) {
  const s = p.s, a = p.y[p.year], y = p.year;
  const head = `<b>${t('PS')} ${s[2]} · ${esc(s[3])}</b><div class="sub">${esc(p.city)}, ${esc(COUNTRY[p.cc].name)} · ${y}</div>`;
  if (!a.valid) return head + t('No results reported');
  const rows = a.order.slice(0, 3).map(k => `<span class="sw" style="background:${listColor(y, k)}"></span><span>${esc(lname(y, k))}</span><span class="r">${pct(a.share[k])}</span>`).join('');
  return head + `<div class="kv">${rows}</div><div style="margin-top:6px;color:var(--ink-2)">${t('Turnout {p} · {v} of {r} registered voted', { p: pct(a.turnout), v: fmt(a.voted), r: fmt(a.reg) })}</div>`;
}
abroadEl.addEventListener('pointermove', e => {
  const d = e.target.closest('circle.dot');
  if (!d || e.pointerType === 'touch') { tip.hidden = true; return; }
  showTip(e, stationTip(STN[d.dataset.y][+d.dataset.i]));
});
abroadEl.addEventListener('pointerleave', () => { tip.hidden = true; });
abroadEl.addEventListener('click', e => {
  const u = e.target.closest('[data-unit]');
  if (u) { tunit = u.dataset.unit; save(); paint(); return; }
  const z = e.target.closest('[data-zoom]');
  if (z) { openZoom(z.dataset.zoom); return; }
  const card = e.target.closest('.card');
  if (card) select(selected === COUNTRY[card.dataset.cc] ? null : COUNTRY[card.dataset.cc]);
});
abroadEl.addEventListener('keydown', e => {
  const card = e.target.closest('.card');
  if (card && !e.target.closest('[data-zoom]') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); card.click(); }
});

layout(); paint(); renderPanel();
new ResizeObserver(() => layout()).observe(document.getElementById('map'));
const repaint = () => { paint(); renderPanel(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint);
new MutationObserver(repaint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
</body>
